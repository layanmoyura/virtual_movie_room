version: "3.8"

services:
  virtual-movie-room:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virtual_movie_room
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - NODE_ENV=production
      - PORT=7860
      - MAX_PARTICIPANTS=20
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 3
